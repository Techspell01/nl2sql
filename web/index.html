<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Argus · AI data analyst</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111111'/%3E%3Cpath d='M5 16s4.2-8 11-8 11 8 11 8-4.2 8-11 8S5 16 5 16z' fill='none' stroke='white' stroke-width='2.2'/%3E%3Ccircle cx='16' cy='16' r='3.6' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/styles.css">
  <script>
    try { const t = localStorage.getItem("nl2sql.theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" id="brand-mark"></span>
        Argus
      </div>
      <div class="topbar-spacer"></div>
      <span class="chip hide-sm" id="data-chip" hidden></span>
      <span class="chip hide-sm" id="model-chip" hidden></span>
      <button class="icon-btn" id="theme-btn" type="button" aria-label="Toggle light and dark theme"></button>
    </header>
    <div class="body">
      <nav class="sidebar" aria-label="Main">
        <button class="nav-item" data-view="ask" type="button"></button>
        <button class="nav-item" data-view="guard" type="button"></button>
        <button class="nav-item" data-view="schema" type="button"></button>
        <button class="nav-item" data-view="eval" type="button"></button>
        <div class="sidebar-label">Recent questions</div>
        <div id="history"></div>
        <div class="sidebar-foot" id="sidebar-foot"></div>
      </nav>
      <main class="main" id="main"></main>
    </div>
  </div>
  <script src="/static/charts.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
